{% extends 'accounts/base.html' %}
{% block title %}Registrar Pagamento — {{ grupo.name }}{% endblock %}

{% block content %}
<div style="max-width:450px;margin:0 auto;">
    <h2 style="margin-bottom:0.5rem;">Registrar pagamento</h2>
    <p class="text-muted" style="margin-bottom:1.5rem;">Grupo: {{ grupo.name }}</p>

    <div class="card">
        <form method="POST" action=".">
            {% csrf_token %}

            <div class="form-group">
                <label>Você está pagando para</label>
                <select name="to_user" required>
                    <option value="">Selecione um membro...</option>
                    {% for membro in outros_membros %}
                    <option value="{{ membro.pk }}">{{ membro.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Valor (R$) *</label>
                <input type="number" name="amount" placeholder="0.00" step="0.01" min="0.01" required>
            </div>

            <div class="form-group">
                <label>Observações (opcional)</label>
                <input type="text" name="notes" placeholder="Ex: Pix, dinheiro...">
            </div>

            <div class="flex gap-1 mt-2">
                <button type="submit" class="btn btn-primary">Registrar pagamento</button>
                <a href="{% url 'detalhe_grupo' grupo.pk %}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
