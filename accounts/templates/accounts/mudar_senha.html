{% extends 'accounts/base.html' %}
{% block title %}Mudar Senha{% endblock %}

{% block content %}
<div style="max-width:400px;margin:0 auto;">
    <h2 style="margin-bottom:1.5rem;">Mudar senha</h2>

    <div class="card">
        <form method="POST" action=".">
            {% csrf_token %}

            <div class="form-group">
                <label>Senha atual</label>
                <input type="password" name="senha_atual" required>
            </div>

            <div class="form-group">
                <label>Nova senha</label>
                <input type="password" name="senha_nova" required>
            </div>

            <div class="form-group">
                <label>Confirmar nova senha</label>
                <input type="password" name="senha_nova2" required>
            </div>

            <div class="flex gap-1 mt-2">
                <button type="submit" class="btn btn-primary">Alterar senha</button>
                <a href="{% url 'editar_perfil' %}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
