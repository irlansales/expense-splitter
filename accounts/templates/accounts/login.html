<!-- extends herda todo o HTML do base.html — só precisa preencher os blocks -->
{% extends 'accounts/base.html' %}

{% block title %}Entrar — Expense Splitter{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem;">Entrar</h2>

        <!-- action="." envia para a mesma URL — method POST envia os dados no corpo -->
        <form method="POST" action=".">
            <!-- csrf_token é obrigatório em todo form POST no Django — protege contra ataques CSRF -->
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
        </form>

        <p class="text-muted mt-2" style="text-align: center;">
            Não tem conta? <a href="{% url 'cadastro' %}" class="text-accent">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
