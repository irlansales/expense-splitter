{% extends 'accounts/base.html' %}

{% block title %}Cadastro — Expense Splitter{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem;">Criar conta</h2>

        <form method="POST" action=".">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="nome de usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="password2">Confirmar senha</label>
                <input type="password" id="password2" name="password2" placeholder="repita a senha" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Criar conta</button>
        </form>

        <p class="text-muted mt-2" style="text-align: center;">
            Já tem conta? <a href="{% url 'login' %}" class="text-accent">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
