{% extends 'accounts/base.html' %}
{% block title %}Editar {{ grupo.name }}{% endblock %}

{% block content %}
<div style="max-width:500px;margin:0 auto;">
    <h2 style="margin-bottom:1.5rem;">Editar grupo</h2>

    <div class="card">
        <form method="POST" action=".">
            {% csrf_token %}

            <div class="form-group">
                <label>Nome *</label>
                <input type="text" name="name" value="{{ grupo.name }}" required>
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea name="description" rows="3">{{ grupo.description|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label>Categoria</label>
                <select name="category">
                    {% for valor, texto in categoria_choices %}
                    <!-- selected marca a opção que está atualmente salva -->
                    <option value="{{ valor }}" {% if grupo.category == valor %}selected{% endif %}>
                        {{ texto }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex gap-1 mt-2">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'detalhe_grupo' grupo.pk %}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Zona de perigo: apagar grupo -->
    <div class="card" style="border-color:var(--danger);margin-top:1.5rem;">
        <h3 style="color:var(--danger);margin-bottom:0.5rem;">Zona de perigo</h3>
        <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem;">
            Apagar o grupo remove todas as despesas e splits permanentemente. Esta ação não pode ser desfeita.
        </p>
        <!-- Formulário separado para apagar — só aceita POST na view -->
        <form method="POST" action="{% url 'apagar_grupo' grupo.pk %}"
              onsubmit="return confirm('Tem certeza? Esta ação não pode ser desfeita.')">
            {% csrf_token %}
            <button type="submit" class="btn" style="background:var(--danger);color:#fff;">
                Apagar grupo permanentemente
            </button>
        </form>
    </div>
</div>
{% endblock %}
